pm_task:
  description: >
    你收到了以下项目需求：
    项目名称：{project_name}
    项目描述：{project_description}

    请分析这个需求，拆解为可执行的子任务，并给下游团队（市场分析师、营销战略师、内容创作师、内容审核员）提供清晰的执行指引。
    如果用户提供了上传文件的内容，也请一并分析并纳入任务拆解中。
  expected_output: >
    一份结构化的任务简报，包含需求分析、任务拆解清单和给下游的关键指引。
  agent: project_manager

research_task:
  description: >
    基于项目经理的任务简报，对客户提供的产品{project_name}和竞争对手进行深入的调研分析。
    请确保找到任何有趣的相关信息。我们正在就以下项目与他们合作：{project_description}。
    如果你需要更多信息，可以使用搜索工具进行查询。
  expected_output: >
    关于客户、产品和竞争对手的完整市场调研报告，包括市场概况、竞品分析和目标受众洞察。
  agent: market_analyst

strategy_task:
  description: >
    基于项目经理的任务指引和市场分析师的调研报告，为项目{project_description}制定全面的营销战略。
    项目名称为{project_name}。
    你需要提出3个差异化的备选战略方案：
    - 方案A：稳健保守型，基于已被验证的营销打法
    - 方案B：创新突破型，采用前沿的营销思维和渠道
    - 方案C：组合平衡型，兼顾稳健与创新
    每个方案需要有不同的定位、侧重点和渠道组合。
    充分使用上游所有见解来制定高质量的战略，如果某些市场信息需要确认，可以使用搜索工具。
  expected_output: >
    一份详细的营销战略文件，包含3个备选战略方案（各有不同的定位和侧重点）、每个方案的战术清单、渠道清单、关键绩效指标(KPI)，以及最终推荐方案和推荐理由。
  agent: marketing_strategist

campaign_idea_task:
  description: >
    基于营销战略（特别是推荐方案），为{project_description}开发富有创意的营销活动构思。

    创意要求：
    - 新颖性：不能是行业里老生常谈的做法，要有让人眼前一亮的角度
    - 多样性：3个创意需覆盖不同的受众细分群体和推广渠道，各有独特切入角度
    - 可行性：要考虑目标受众的行为习惯和渠道的触达效率
    - 话题性：设计具有自传播潜力的内容机制
    - 跨界思维：可以借鉴娱乐、游戏、教育等其他行业的玩法，进行跨界融合

    可以适当使用搜索工具了解近期成功的营销案例作为灵感参考，但不要照搬。
  expected_output: >
    3个活动创意，每个包含名称、描述、目标受众和渠道。创意之间要有明显的差异性。
  agent: content_creator

copy_creation_task:
  description: >
    基于营销战略和已策划的活动创意，为{project_description}制作具体的营销文案。
    确保文案引人注目、清晰明了，并适合目标受众和投放渠道的特性。
    每个活动创意的文案应有独特的语气和风格，避免千篇一律。
  expected_output: >
    每个活动创意对应的营销文案，包含对应的活动名称、标题和正文。
  agent: content_creator

review_task:
  description: >
    对内容创作师生成的全部方案（活动创意和营销文案）进行质量审核，同时结合营销战略进行检查。
    审核维度包括：品牌风险、敏感词、事实错误、逻辑一致性、与战略的匹配度。

    重要：你需要输出修正后的完整活动创意列表（corrected_ideas）和完整文案列表（corrected_copies）。
    即使只改了一句话，也要输出包含该修改的完整版本，这样下游可以直接使用你的输出作为最终方案。

    在revisions_made中用「将"A"改为"B"」的对照格式清晰记录每处修改。
    只有内容质量极差（几乎需要重写）时才将approved设为false。
  expected_output: >
    审核结论（是否通过、发现的问题、修正对照、修正后的完整活动创意和文案、审核备注）。
  agent: content_reviewer
